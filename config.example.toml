[plugin]
enabled = false
# 由 MaiBot Runner 维护，请勿手动修改
config_version = "1.0.0"
timezone = "Asia/Shanghai"
tick_seconds = 60
max_interaction_chars = 1200
retry_cooldown_minutes = 15.0
enable_proactive_messages = false

[persona]
name = ""
viewpoint = []
goals = ""
relationship_stages = []
event_line_domains = []
micro_event_domains = []

[emotion]
trait_p = 0.0
trait_a = 0.0
trait_d = 0.0
tau_emotion_min = 20.0
tau_mood_hours = 12.0
regulation = 0.65
appraisal_window_hours = 2.0
max_delta_per_event = 0.3
max_micro_event_bias = 0.15

[affection]
evaluate_daily_at = "23:00"
max_delta = 0.1
evidence_hours = 24.0

[event_lines]
max_active = 3
advance_times = ["13:00", "21:00"]
talkable_threshold = 0.6

[schedule]
min_interval_hours = 4.0
daily_limit = 3
silent_hours = [1, 7]
default_active_hour_hint = 21
fallback_replan_hours = 24.0
# 私聊中明确结束对话后，请 Planner 决定下一次主动联系该用户的时间
decide_after_private_chat_end = false
# off / whitelist / blacklist，按用户 ID 精确匹配
decide_user_filter_mode = "off"
decide_user_whitelist = []
decide_user_blacklist = []

[batch]
todo_extract_hours = 4.0
life_generate_at = "08:00"
# 开启后只读使用 MaiTrace 日程；日常小事件仍由 Mai Persona 维护
use_maitrace_schedule = false
diary_generate_at = "23:30"

[exposure]
daily_limit = 2
